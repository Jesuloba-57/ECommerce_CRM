{% extends "base.html" %}

{% block title %}Canes Market | Create Account{% endblock %}

{% block content %}
<section class="auth-shell">
    <article class="auth-panel">
        <div>
            <p class="eyebrow">Get started</p>
            <h1>Create your marketplace account.</h1>
            <p class="muted">Choose whether this account should act as a buyer, a seller, or both.</p>
        </div>

        <form method="POST" class="form-card auth-form two-column-form">
            <label>
                <span>First name</span>
                <input type="text" name="first_name" placeholder="Jordan" required>
            </label>
            <label>
                <span>Last name</span>
                <input type="text" name="last_name" placeholder="Smith">
            </label>
            <label class="full-width">
                <span>Email</span>
                <input type="email" name="email" placeholder="you@example.com" required>
            </label>
            <fieldset class="full-width role-fieldset">
                <legend>Account type</legend>
                <label class="role-option">
                    <input type="checkbox" name="roles" value="buyer" checked>
                    <span>Buyer</span>
                </label>
                <label class="role-option">
                    <input type="checkbox" name="roles" value="seller" checked>
                    <span>Seller</span>
                </label>
            </fieldset>
            <label>
                <span>Password</span>
                <input type="password" name="password1" placeholder="At least 8 characters" required>
            </label>
            <label>
                <span>Confirm password</span>
                <input type="password" name="password2" placeholder="Repeat your password" required>
            </label>
            <button class="button full-width" type="submit">Create account</button>
        </form>

        <p class="auth-switch">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>.</p>
    </article>
</section>
{% endblock %}
